<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />

		<title>
			Schemist - Cohesive and accessible color schemes
		</title>

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link
			rel="stylesheet"
			href="%sveltekit.assets%/fonts.css"
		/>

		<!-- Picks the theme before the first paint, as the prerendered page can't know it. Mirrors isDarkSchemeEnabled() in src/lib/features.ts. -->
		<script>
			try {
				const stored = localStorage.getItem(
					'darkSchemeFeature'
				);
				const isDark =
					stored === null
						? matchMedia('(prefers-color-scheme: dark)')
								.matches
						: !!parseInt(stored);

				document.documentElement.dataset.theme = isDark
					? 'dark'
					: 'light';
			} catch {}
		</script>

		%sveltekit.head%
	</head>

	<body>
		<div class="app">%sveltekit.body%</div>
	</body>
</html>
